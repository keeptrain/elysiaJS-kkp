# Dev: db saja di container, app jalan di host.
#   podman compose -f .docker/compose.yaml -f .docker/compose.dev.yaml up -d db
#   bun run --watch src/index.ts
# App host konek ke db via localhost:${DB_HOST_PORT:-5433} (lihat DATABASE_URL
# di ../.env.development). Jangan `up` service app di dev agar port 3000
# tidak bentrok dengan app host.
services:
  db:
    container_name: elysia-postgres-dev
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    env_file:
      - ../.env.development
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kkp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kkp_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kkp_dev}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev:
